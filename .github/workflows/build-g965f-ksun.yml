name: Build G965F KernelSU-Next

on:
  push:
    branches:
      - update-kernelsu-next-v3.4.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev libncurses-dev cpio zip device-tree-compiler clang-18 lld-18 llvm-18

      - name: Provide Clang 18 to Apollo build script
        run: |
          mkdir -p ../compiler/clang-custom/bin ../compiler/clang-custom/lib
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            ln -s "/usr/bin/${tool}-18" "../compiler/clang-custom/bin/${tool}"
          done

      - name: Build G965F Enforcing with KernelSU-Next
        shell: bash
        run: |
          set -o pipefail
          printf '2\n8\n2\ny\nn\n' | bash apollo.sh 2>&1 | tee build.log
          image=$(find Apollo/Product -maxdepth 1 -type f -name 'DS-ACK-V1.12-G965F-*-KSU.img' -print -quit)
          test -n "$image"
          test -s "$image"
          echo "Built image: $image"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g965f-ksun-build
          path: |
            build.log
            Apollo/Product/DS-ACK-V1.12-G965F-*-KSU.img
          if-no-files-found: warn
